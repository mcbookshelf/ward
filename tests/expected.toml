# Never in any report: excluded by tests/ward.toml, muted by @coverage off
absent = ["ward:coverage/excluded", "ward:coverage/muted"]

[failed]
"ward:fail_expected" = "ward intentional failure"
"ward:assert_fail_expected" = "Expected block"
"ward:timeout_expected" = { message = "Await timed out: Expected entity matching", line = 2, tick = 40 }
"ward:errored_expected" = "Unknown scoreboard objective"
"ward:error_order" = "first failure"
"ward:flaky_exhausted" = "flaky ran out of attempts"
"ward:errored_function" = "Unknown function 'ward:helper/missing'"
"ward:negated_count_expected" = "found 1"
"ward:deadline_expected" = { message = "at the deadline", line = 4, tick = 20 }
"ward:predicate_inline_expected" = "random_chance"
"ward:result_none_expected" = "the command did not run"
"ward:run_error_expected" = "Expected command to succeed: No entity was found"
"ward:chain_limit_expected" = "limit of 5 commands"
"ward:instance_timeout_expected" = "Exceeded 20 tick limit"
"ward:await_error_expected" = "Unknown scoreboard objective"
"ward:data_mismatch_expected" = "found {value:0b} at path.to.test"
"ward:data_missing_expected" = "found {test:{value:0b}} at path.to"

[skipped]
"ward:optional_expected" = "Fail command invoked"

# Line categories per function: executed (dispatched), guarded (reached but the
# fork or condition never passed) and unreached
[coverage."ward:coverage/target"]
executed = [2, 3, 4, 7, 8, 9]
guarded = [5, 6]
unreached = [10]

[coverage."ward:coverage/check"]
executed = [1]

[coverage."ward:coverage/macro"]
executed = [1]

[coverage."ward:coverage/unused"]
executed = []
unreached = [1]

# The lines of the overlay the server loaded, not of the root file it replaces
[coverage."ward:coverage/overlaid"]
executed = [2, 4]
guarded = [3]
unreached = []

# Marker-excluded lines (4 and 6) drop out even though they ran
[coverage."ward:coverage/markers"]
executed = [2]
guarded = []
unreached = []

# Outcome counts per condition node: [times_true, times_false]. The gated
# predicate short-circuits its second term; blocked only ever tests false
[conditions."ward:coverage/gated"]
"" = [1, 0]
"terms[0]" = [1, 0]
"terms[1]" = [0, 0]

[conditions."ward:coverage/blocked"]
"" = [0, 1]

# The condition of an enchantment effect. Nothing attacks, so it is never evaluated.
# In audit mode the enchantment is also encoded for a client, which takes the condition back out of its delegate
[conditions."ward:coverage/conditional"]
"effects.minecraft:damage[0].requirements" = [0, 0]

[conditions."ward:coverage/unused"]
"" = [0, 0]
"term" = [0, 0]

# The conditional number provider drives a loot pool's rolls; spawning the
# table's loot evaluates its condition
[conditions."ward:coverage/rolls"]
"condition" = [1, 0]

# The emerald entry is reached on every roll but its zero-chance condition
# always fails, so the entry stays blocked
[conditions."ward:coverage/drops"]
"pools[0].entries[1].condition" = [0, 1]

# Block runs as [reached, ran]: rolling the table counts the table itself, its
# entries, and the number provider and slot source it pulls in; using a lever
# and feeding a cow fire their advancement criteria
[runs."ward:coverage/drops"]
"" = [1, 1]
"pools[0].entries[0]" = [1, 1]
"pools[0].entries[1]" = [1, 0]

# An item modifier is one loot function: applying it once runs it once
[runs."ward:coverage/double"]
"" = [1, 1]

[runs."ward:coverage/rolls"]
"" = [1, 1]

[runs."ward:coverage/chest_slots"]
"" = [1, 1]

# Nothing references these: their universe still reports, all zero. The
# entry node is dropped by a tests/ward.toml node pattern
[runs."ward:coverage/untouched"]
"" = [0, 0]

[runs."ward:coverage/idle"]
"" = [0, 0]

[runs."ward:coverage/spare"]
"" = [0, 0]

# One criterion grants per lever-flipping dummy; the impossible one never fires
[runs."ward:coverage/partial"]
"criteria.flipped" = [2, 2]
"criteria.never" = [0, 0]

# Two tests flip a lever with their own dummies, so the criterion grants twice
[runs."ward:use_lever"]
"criteria.use_lever" = [2, 2]

[runs."ward:feed_cow"]
"criteria.feed" = [1, 1]

# Load diagnostics by kind: the id, and a part of the message
[diagnostics."minecraft:function"]
"ward:broken" = "Unknown or incomplete command"

[diagnostics."minecraft:tags/function"]
"ward:broken" = "Missing references: ward:this_function_does_not_exist"

[diagnostics."minecraft:loot_table"]
"ward:broken" = "malformed JSON"
"ward:invalid" = "Not a json array"
"ward:ref_missing" = "unbound value"
"ward:this_table_does_not_exist" = "Referenced but not defined"

# A tag that names a missing element: the reference is dropped, or no client could join
[diagnostics."minecraft:enchantment"]
"ward:missing_in_tag" = "Referenced but not defined"

[diagnostics."minecraft:test_environment"]
"ward:missing_setup" = "Unknown function 'ward:helper/does_not_exist'"

[diagnostics."minecraft:advancement"]
"ward:broken" = "requirements did not exactly match"

[diagnostics."minecraft:worldgen/biome"]
"ward:broken" = "No key features"

[diagnostics."ward:test"]
"ward:invalid_test" = "Unknown or incomplete command"
"ward:invalid_environment" = "ward:does_not_exist"
"ward:invalid_directive" = "Value must be true or false"
"ward:invalid_dimension" = "Unknown dimension 'ward:does_not_exist'"
"ward:invalid_macro" = "tests take no macro arguments"
"ward:invalid_slash" = "preceding forwards slash"
"ward:invalid_number" = "Value must be a whole number"
"ward:invalid_successes" = "@required_successes is above @max_attempts"
"ward:unknown_directive" = "Invalid directive @does_not_exist on line 1: Unknown directive"

[diagnostics."pack.mcmeta"]
"broken" = "malformed JSON"
"overlay" = "not-a-range"
