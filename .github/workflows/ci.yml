name: ci
on:
  push:
    branches: [main, "[0-9]*.[0-9]*"]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The daemon code has Windows branches
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: setup just
        uses: extractions/setup-just@v4
      - name: install dependencies
        run: uv sync --all-extras
      - name: lint, type-check and test
        run: just check
      - name: check packaging
        if: runner.os == 'Linux'
        run: |
          uv build --all-packages
          uvx twine check dist/*

  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: setup just
        uses: extractions/setup-just@v4
      # Builds the mod as the dev environment, so a separate build job would only repeat it
      - name: run the integration suite
        run: just verify
      - name: check the command tree
        run: |
          ./gradlew runGenerateCommands
          uv run tools/commands.py --check
      - name: upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: ward-jar
          path: build/libs/
      - name: upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-server-logs
          path: |
            ~/.cache/mcward/environments/dev/*/logs/latest.log
            ~/.cache/mcward/environments/dev/*/ward.log
            ~/.cache/mcward/environments/dev/*/crash-reports/
