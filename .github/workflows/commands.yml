name: commands
on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: generate the command tree
        run: |
          chmod +x ./gradlew
          ./gradlew runGenerateCommands

      - name: keep the tree only when it differs
        id: tree
        run: |
          dir=packages/mcward-beet/src/mcward/mecha/resources

          # Key order is not semantic: restore files that only got reordered
          for file in $(git diff --name-only -- "$dir"); do
            if [ "$(jq -S . "$file")" = "$(git show "HEAD:$file" | jq -S .)" ]; then
              git checkout -q -- "$file"
            fi
          done

          status=$(git status --porcelain -uall -- "$dir")
          if [ -z "$status" ]; then
            echo "command tree unchanged"
            exit 0
          fi
          if echo "$status" | grep -qv '^??'; then
            echo "::error::the command tree changed for an already committed" \
              "version; commands must only change alongside a mod version bump"
            exit 1
          fi

          new=$(echo "$status" | head -1 | awk '{print $2}')
          name=$(basename "$new")
          closest=$(git ls-files -- "$dir" | xargs -rn1 basename | { cat; echo "$name"; } \
            | sort -V | grep -B1 -Fx "$name" | head -1)
          if [ "$closest" != "$name" ] \
            && [ "$(jq -S . "$new")" = "$(jq -S . "$dir/$closest")" ]; then
            rm "$new"
            echo "tree identical to $closest, nothing to release"
          else
            echo "version=$(basename "$new" .json)" >> "$GITHUB_OUTPUT"
          fi

      - name: setup uv
        if: steps.tree.outputs.version
        uses: astral-sh/setup-uv@v8.2.0

      - name: bump the python minor
        if: steps.tree.outputs.version
        id: bump
        run: |
          IFS=. read -r major minor _ <<< "$(uv version --short)"
          version="$major.$((minor + 1)).0"
          uv run tools/bump.py python "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: mint bot token
        if: steps.bump.outputs.version
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: open release pull request
        if: steps.bot.outputs.token
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.bot.outputs.token }}
          add-paths: |
            packages/mcward-beet/src/mcward/mecha/resources
            pyproject.toml
            uv.lock
          branch: release/python-${{ steps.bump.outputs.version }}
          delete-branch: true
          commit-message: 'chore(release): bump python to ${{ steps.bump.outputs.version }}'
          title: 'chore(release): bump python to ${{ steps.bump.outputs.version }}'
          body: |
            Ward ${{ steps.tree.outputs.version }} introduced a new command tree:
            ships the generated json and bumps the python minor.

            Merging releases **mcward ${{ steps.bump.outputs.version }}** to PyPI.
          committer: mcbookshelf[bot] <mcbookshelf[bot]@users.noreply.github.com>
          author: mcbookshelf[bot] <mcbookshelf[bot]@users.noreply.github.com>

      - name: enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          # The release decision was made by the tree diffing on main; the
          # required CI checks gate the merge, so a red PR waits for a human
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" \
            --squash --auto --repo "$GITHUB_REPOSITORY"
