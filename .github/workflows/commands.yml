name: commands
on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: generate the command tree
        run: ./gradlew runGenerateCommands

      - name: setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: keep the tree only when it differs
        id: tree
        run: uv run tools/commands.py

      - name: bump the python minor
        if: steps.tree.outputs.version
        id: bump
        run: |
          IFS=. read -r major minor _ <<< "$(uv version --short)"
          version="$major.$((minor + 1)).0"
          uv run tools/bump.py python "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: mint bot token
        if: steps.bump.outputs.version
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: open release pull request
        if: steps.bot.outputs.token
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.bot.outputs.token }}
          add-paths: |
            packages/mcward-beet/src/mcward/mecha/resources
            packages/mcward-beet/pyproject.toml
            packages/mcward-cli/pyproject.toml
            pyproject.toml
            uv.lock
          branch: release/python-${{ steps.bump.outputs.version }}
          delete-branch: true
          commit-message: 'chore(release): bump python to ${{ steps.bump.outputs.version }}'
          title: 'chore(release): bump python to ${{ steps.bump.outputs.version }}'
          body: 'New command tree from Ward ${{ steps.tree.outputs.version }}. Merging releases **mcward ${{ steps.bump.outputs.version }}** to PyPI.'
          committer: mcbookshelf[bot] <mcbookshelf[bot]@users.noreply.github.com>
          author: mcbookshelf[bot] <mcbookshelf[bot]@users.noreply.github.com>

      - name: enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          # Merges by itself once the required checks pass
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" \
            --squash --auto --repo "$GITHUB_REPOSITORY"
