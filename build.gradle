plugins {
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.8.0'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	splitEnvironmentSourceSets()

	mods {
		"ward" {
			sourceSet sourceSets.main
		}
	}

	accessWidenerPath = file("src/main/resources/ward.accesswidener")

	runs {
		generateCommands {
			server()
			configName = "Generate command tree"
			vmArg "-Dward.generate.commands=${rootDir}/packages/mcward-beet/src/mcward/mecha/resources"
		}
	}
}

checkstyle {
	configFile = rootProject.file('checkstyle.xml')
	toolVersion = '13.7.0'
}

spotless {
	lineEndings = com.diffplug.spotless.LineEnding.UNIX

	java {
		importOrder('java', 'javax', '', 'net.minecraft', 'dev.mcbookshelf')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
