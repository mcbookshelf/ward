[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcward"
version = "2.0.0"
description = "A testing framework for Minecraft datapacks using mcfunction."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MPL-2.0" }
authors = [{ name = "Aksiome", email = "54895777+aksiome@users.noreply.github.com" }]
dependencies = [
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
beet = ["mcward-beet==2.0.0"]
cli = ["mcward-cli==2.0.0"]
mecha = ["mcward-beet[mecha]==2.0.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.103",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/mcward-beet", "packages/mcward-cli"]

[tool.uv.sources]
mcward-beet = { workspace = true }
mcward-cli = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["packages/mcward/src/mcward"]

[tool.hatch.build.targets.sdist]
include = [
    "packages/mcward/src",
    "packages/mcward/tests",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["mcward"]
combine-as-imports = true
split-on-trailing-comma = true

[[tool.ty.overrides]]
include = ["packages/mcward-beet/**", "packages/mcward-cli/**"]

[tool.ty.overrides.rules]
import-not-found = "ignore"
