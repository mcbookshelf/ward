[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcward-cli"
dynamic = ["version"]
description = "Command-line interface for Ward, a testing framework for Minecraft datapacks using mcfunction."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MPL-2.0" }
authors = [{ name = "Aksiome", email = "54895777+aksiome@users.noreply.github.com" }]
# The mcward pin follows the version: `just bump python` rewrites it
dependencies = [
    "mcward==1.6.0",
    "click>=8.4.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "rich-click>=1.8.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
mcward = "mcward.cli:main"
ward = "mcward.cli:main"

[tool.uv.sources]
mcward = { workspace = true }

[tool.hatch.version]
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/mcward"]
