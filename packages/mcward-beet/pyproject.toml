[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcward-beet"
dynamic = ["version"]
description = "Beet plugin for Ward, a testing framework for Minecraft datapacks using mcfunction."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MPL-2.0" }
authors = [{ name = "Aksiome", email = "54895777+aksiome@users.noreply.github.com" }]
# The mcward pins follow the version: `just bump python` rewrites them
dependencies = [
    "mcward==1.6.0",
    "mcward-cli==1.6.0",
    "beet>=0.116.0",
]

[project.optional-dependencies]
mecha = [
    "mecha>=0.104.1",
]

# Loaded by the beet toolchain to register the beet test command
[project.entry-points.beet]
commands = "mcward.beet.commands"

[tool.uv.sources]
mcward = { workspace = true }
mcward-cli = { workspace = true }

[tool.hatch.version]
path = "../../pyproject.toml"
pattern = '^version = "(?P<version>[^"]+)"$'

[tool.hatch.build.targets.wheel]
packages = ["src/mcward"]
